<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Sistema de Ocorrências</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar will be inserted here by JavaScript -->
        <div id="sidebar-container"></div>

        <div class="main-content">
            <div class="content-wrapper">
                <!-- Dashboard Cards will be inserted here -->
                <div id="dashboard-cards"></div>

                <!-- Content sections -->
                <div id="content-sections">
                    <!-- Gerenciar Escolas section -->
                    <div id="schools-section" class="content-section">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-building"></i> Gerenciar Escolas</h3>
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="nomeEscola">Nome da Nova Escola</label>
                                    <input type="text" id="nomeEscola" placeholder="Nome da Escola">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn" onclick="criarEscola()">
                                    <i class="fas fa-plus"></i>
                                    Criar Escola
                                </button>
                            </div>
                            <h4 style="margin-top: 30px;"><i class="fas fa-list"></i> Escolas Registradas</h4>
                            <div id="escolas-list"></div>
                        </div>
                    </div>

                    <!-- Criar Usuário section -->
                    <div id="create-user-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-user-plus"></i> Criar Novo Usuário</h3>
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="username">Username</label>
                                    <input type="text" id="username" placeholder="Username">
                                </div>
                                <div class="input-group">
                                    <label for="password">Senha</label>
                                    <input type="password" id="password" placeholder="Senha">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="role">Role</label>
                                    <select id="role">
                                        <option value="admin">Admin</option>
                                        <option value="usuario">Usuário</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label for="empresa_id">Escola</label>
                                    <select id="empresa_id"></select>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn" onclick="criarUsuario()">
                                    <i class="fas fa-save"></i>
                                    Criar Usuário
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Usuários Criados section -->
                    <div id="all-users-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-list"></i> Todos os Usuários</h3>
                            </div>
                            <div id="all-users-list"></div>
                        </div>
                    </div>

                    <!-- Promover/Rebaixar section -->
                    <div id="promote-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-user-exchange"></i> Gerenciar Níveis de Usuários</h3>
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="promoteSchool">Selecionar Escola</label>
                                    <select id="promoteSchool" onchange="loadUsersBySchool()"></select>
                                </div>
                            </div>
                            <div id="promote-users-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Components -->
    <script src="../components/Sidebar.js"></script>
    <script src="../components/DashboardCards.js"></script>
    <script src="../js/superadmin.js"></script>
</body>
</html>
