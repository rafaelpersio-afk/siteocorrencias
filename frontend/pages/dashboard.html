<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Ocorrências</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar will be inserted here by JavaScript -->
        <div id="sidebar-container"></div>

        <div class="main-content">
            <div class="content-wrapper">
                <!-- Dashboard Cards will be inserted here -->
                <div id="dashboard-cards"></div>

                <!-- Monthly Chart will be inserted here -->
                <div id="monthly-chart"></div>

                <!-- Content sections -->
                <div id="content-sections">
                    <!-- Incidents section -->
                    <div id="incidents-section" class="content-section">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-exclamation-triangle"></i> Minhas Ocorrências</h3>
                                <button class="btn" onclick="showNewIncidentForm()">
                                    <i class="fas fa-plus"></i>
                                    Nova Ocorrência
                                </button>
                            </div>
                            <div id="incidents-list"></div>
                        </div>
                    </div>

                    <!-- New Incident Form (hidden by default) -->
                    <div id="new-incident-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-plus"></i> Nova Ocorrência</h3>
                                <button class="btn btn-secondary" onclick="hideNewIncidentForm()">
                                    <i class="fas fa-times"></i>
                                    Cancelar
                                </button>
                            </div>
                            <form id="incident-form" onsubmit="createIncident(event)">
                                <div class="form-row">
                                    <div class="input-group">
                                        <label for="aluno">Nome do Aluno *</label>
                                        <input type="text" id="aluno" name="aluno" required>
                                    </div>
                                    <div class="input-group">
                                        <label for="turma">Turma *</label>
                                        <input type="text" id="turma" name="turma" required>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label for="descricao">Descrição da Ocorrência *</label>
                                    <textarea id="descricao" name="descricao" rows="4" required></textarea>
                                </div>
                                <div class="form-row">
                                    <div class="input-group">
                                        <label for="data">Data *</label>
                                        <input type="date" id="data" name="data" required>
                                    </div>
                                    <div class="input-group">
                                        <label for="hora">Hora *</label>
                                        <input type="time" id="hora" name="hora" required>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn">
                                        <i class="fas fa-save"></i>
                                        Criar Ocorrência
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Users section (for admins) -->
                    <div id="users-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-users"></i> Gerenciar Usuários</h3>
                                <button class="btn" onclick="showNewUserForm()">
                                    <i class="fas fa-user-plus"></i>
                                    Novo Usuário
                                </button>
                            </div>
                            <div id="users-list"></div>
                        </div>
                    </div>

                    <!-- Schools section (for super admin) -->
                    <div id="schools-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-building"></i> Gerenciar Escolas</h3>
                                <button class="btn" onclick="showNewSchoolForm()">
                                    <i class="fas fa-plus"></i>
                                    Nova Escola
                                </button>
                            </div>
                            <div id="schools-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Components -->
    <script src="../components/Sidebar.js"></script>
    <script src="../components/DashboardCards.js"></script>
    <script src="../components/MonthlyChart.js"></script>

    <!-- Main dashboard script -->
    <script src="../js/dashboard.js"></script>
</body>
</html>
