<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sistema de Ocorrências</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar will be inserted here by JavaScript -->
        <div id="sidebar-container"></div>

        <div class="main-content">
            <div class="content-wrapper">
                <!-- Dashboard Cards will be inserted here -->
                <div id="dashboard-cards"></div>

                <!-- Content sections -->
                <div id="content-sections">
                    <!-- Aprovar Usuários section -->
                    <div id="aprovar-section" class="content-section">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-check-circle"></i> Aprovar Usuários</h3>
                            </div>
                            <div id="users-pending-list"></div>
                        </div>
                    </div>

                    <!-- Gerenciar Níveis section -->
                    <div id="niveis-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-user-graduate"></i> Gerenciar Níveis de Usuários</h3>
                            </div>
                            <div id="users-niveis-list"></div>
                        </div>
                    </div>

                    <!-- Criar Ocorrência section -->
                    <div id="criar-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-plus-circle"></i> Criar Nova Ocorrência</h3>
                            </div>
                            <form id="incident-form" onsubmit="createIncident(event)">
                                <div class="form-row">
                                    <div class="input-group">
                                        <label for="aluno">Nome do Aluno *</label>
                                        <input type="text" id="aluno" name="aluno" required>
                                    </div>
                                    <div class="input-group">
                                        <label for="turma">Turma *</label>
                                        <input type="text" id="turma" name="turma" required>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label for="descricao">Descrição da Ocorrência *</label>
                                    <textarea id="descricao" name="descricao" rows="4" required></textarea>
                                </div>
                                <div class="form-row">
                                    <div class="input-group">
                                        <label for="data">Data *</label>
                                        <input type="date" id="data" name="data" required>
                                    </div>
                                    <div class="input-group">
                                        <label for="hora">Hora *</label>
                                        <input type="time" id="hora" name="hora" required>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn">
                                        <i class="fas fa-save"></i>
                                        Criar Ocorrência
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Ocorrências section -->
                    <div id="ocorrencias-section" class="content-section" style="display: none;">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="fas fa-list"></i> Todas as Ocorrências da Escola</h3>
                            </div>
                            <div id="ocorrencias-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Components -->
    <script src="../components/Sidebar.js"></script>
    <script src="../components/DashboardCards.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
