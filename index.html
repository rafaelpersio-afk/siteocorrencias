<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ocorrências - Seleção de Escola</title>
    <link rel="stylesheet" href="frontend/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .school-selection-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .school-selection-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .school-selection-card h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .school-selection-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .school-btn {
            padding: 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .school-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        .school-btn i {
            font-size: 24px;
        }
        .super-admin-link {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .super-admin-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .super-admin-link a:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="school-selection-container">
        <div class="school-selection-card">
            <h1><i class="fas fa-school"></i> Sistema de Ocorrências</h1>
            <p>Selecione sua escola para continuar</p>
            <div id="schoolsContainer" class="schools-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando escolas...</div>
            </div>
            <div class="super-admin-link">
                <a href="#" id="superAdminLink"><i class="fas fa-key"></i> Acesso Super Admin</a>
            </div>
        </div>
    </div>
    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:3000' 
            : `https://${window.location.hostname}`;

        // Carregar escolas ao iniciar a página
        async function loadSchools() {
            try {
                const response = await fetch(`${API_URL}/empresas`);
                const schools = await response.json();
                
                const container = document.getElementById('schoolsContainer');
                container.innerHTML = '';
                
                if (schools.length === 0) {
                    container.innerHTML = '<p style="color: #666;">Nenhuma escola disponível</p>';
                    return;
                }
                
                schools.forEach(school => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'school-btn';
                    btn.innerHTML = `<i class="fas fa-graduation-cap"></i> ${school.nome}`;
                    btn.onclick = () => selectSchool(school.id, school.nome);
                    container.appendChild(btn);
                });
            } catch (error) {
                console.error('Erro ao carregar escolas:', error);
                document.getElementById('schoolsContainer').innerHTML = '<p style="color: red;">Erro ao carregar escolas</p>';
            }
        }

        function selectSchool(schoolId, schoolName) {
            window.location.href = `login.html?school=${schoolId}&schoolName=${encodeURIComponent(schoolName)}`;
        }

        // Link para super_admin (sem seleção de escola)
        document.getElementById('superAdminLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'login.html';
        });

        // Carregar escolas quando a página carrega
        document.addEventListener('DOMContentLoaded', loadSchools);
    </script>
</body>
</html>
