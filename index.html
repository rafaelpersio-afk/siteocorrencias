<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ocorrências - Login</title>
    <link rel="stylesheet" href="frontend/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2><i class="fas fa-school"></i> Sistema de Ocorrências</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username"><i class="fas fa-user"></i> Usuário</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="input-group">
                    <label for="empresa"><i class="fas fa-building"></i> Unidade Escolar</label>
                    <select id="empresa" name="empresa_id" required>
                        <option value="">Selecione sua unidade escolar</option>
                        <!-- Opções serão carregadas via JavaScript -->
                    </select>
                </div>
                <button type="submit" class="btn-login">ENTRAR</button>
            </form>
            <a href="frontend/pages/createUser.html" id="createUserLink" class="create-user-link">Criar novo usuário</a>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:3000' 
            : `https://${window.location.hostname}`;

        // Extrair parâmetros da URL (mantido para compatibilidade futura)
        const urlParams = new URLSearchParams(window.location.search);
        const selectedSchoolId = urlParams.get('school');
        const selectedSchoolName = decodeURIComponent(urlParams.get('schoolName') || '');

        // Carregar lista de escolas
        async function loadSchools() {
            try {
                console.log('Carregando escolas...');
                const response = await fetch(`${API_URL}/api/empresas`);

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const schools = await response.json();
                console.log('Escolas carregadas:', schools);

                const select = document.getElementById('empresa');

                // Limpar opções existentes exceto a primeira
                while (select.options.length > 1) {
                    select.remove(1);
                }

                // Adicionar opção padrão se não houver nenhuma
                if (select.options.length === 0) {
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = 'Selecione sua unidade escolar';
                    select.appendChild(defaultOption);
                }

                // Adicionar escolas
                schools.forEach(school => {
                    const option = document.createElement('option');
                    option.value = school.id;
                    option.textContent = school.nome;
                    select.appendChild(option);
                });

                console.log(`${schools.length} escolas carregadas com sucesso`);

            } catch (error) {
                console.error('Erro ao carregar escolas:', error);
                alert('Erro ao carregar lista de escolas. Tente recarregar a página.');
            }
        }

    // Inicializar página
    document.addEventListener('DOMContentLoaded', async () => {
        console.log('Página carregada, inicializando...');
        await loadSchools();

        // Sempre mostrar o selector de escolas
    });

        // Manipular submissão do formulário de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const empresaIdValue = document.getElementById('empresa').value;

            // Validações
            if (!username) {
                alert('Por favor, digite o nome de usuário');
                return;
            }

            if (!password) {
                alert('Por favor, digite a senha');
                return;
            }

            // Validar escola apenas se não for usuário master (Rafa.admin)
            if (username !== 'Rafa.admin' && !empresaIdValue) {
                alert('Por favor, selecione uma unidade escolar');
                return;
            }

            try {
                const payload = {
                    username,
                    password,
                    empresa_id: empresaIdValue ? parseInt(empresaIdValue) : null
                };

                console.log('Enviando payload:', payload);

                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                console.log('Resposta do servidor:', response.status, data);

                if (response.ok && data.token) {
                    // Salvar token e redirecionar pelo nível de acesso
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('username', username);
                    localStorage.setItem('empresa_id', empresaIdValue);
                    if (data.role === 'super_admin') {
                        window.location.href = 'frontend/pages/superadmin.html';
                    } else if (data.role === 'admin') {
                        window.location.href = 'frontend/pages/admin.html';
                    } else {
                        window.location.href = 'frontend/pages/dashboard.html';
                    }
                } else {
                    alert(data.message || data.error || 'Erro ao fazer login');
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Erro na conexão com o servidor');
            }
        });
    </script>
</body>
</html>
